id: api-gateway
name: API Gateway
type: gateway
status: production
owner: platform-team
tags:
  - core
  - networking
  - security
  - ingress
description:
  oneliner: Central entry point for all API requests
  technical: |+
    Kong-based API gateway with rate limiting, JWT validation, request/response transformations, and circuit breaker pattern. Runs as a Kubernetes Ingress controller with horizontal scaling. Supports canary deployments and A/B routing. Used to demonstrate POC capabilities.

    Díky za screenshot — toto je už veľmi dobrý základ. Máš tam všetko podstatné (interfaces, relationships, business capabilities), ale chýbajú dve veci, ktoré chceš doplniť:

    1. **explicitný dátový model**
    2. **presnejší capability model (nie len tagy)**

    Nižšie ti ukážem, ako to tam prirodzene doplniť tak, aby to zapadlo do toho UI, čo už máš.

    ---

    # 🔹 1. Ako zachytiť dátový model

    Najlepšie miesto v tomto layoute:
    👉 buď ako nová sekcia vedľa *Interfaces*, alebo rozšíriť *Interfaces* o typ **data**

    ### ✔️ Odporúčané riešenie: nová sekcia `Data`

    ```markdown
    ## Data

    ### Owns
    - (none)  
      Gateway typicky nevlastní business dáta

    ### Consumes
    - `JWT Token`
      - Source: identity-service
      - Purpose: authentication & authorization
      - Type: transient

    - `Rate limit counters`
      - Source: redis-cache
      - Purpose: throttling
      - Type: cache

    - `Routing configuration`
      - Source: config-db
      - Purpose: dynamic routing rules

    ### Produces
    - `Access logs`
      - Consumers: monitoring / SIEM
      - Type: log stream

    - `Metrics`
      - Consumers: observability stack
      - Type: time-series

    - `Transformed requests/responses`
      - Consumers: downstream services
    ```

    ---

    ### 💡 Dôležitý insight (často sa prehliada)

    Gateway:

    * ❌ nevlastní business data
    * ✅ pracuje s **transient / operational data**

    ➡️ preto je dôležité mať typ dát:

    * `business`
    * `reference`
    * `cache`
    * `config`
    * `transient`
    * `logs`

    ---

    # 🔹 2. Capability model (upgrade oproti tomu čo máš)

    Teraz máš:

    > Business Capabilities = tagy (Customer Mgmt, Payment, ...)

    To je OK, ale:
    👉 **neviem akú rolu komponent hrá**

    ---

    ## ✔️ Navrhované rozšírenie

    Zmeň to z tagov na štruktúru:

    ```markdown
    ## Business Capabilities

    | Capability | Role | Description |
    |----------|------|------------|
    | API Management | Owner | Central entry point for all APIs |
    | Security | Owner | JWT validation, threat protection |
    | Traffic Management | Owner | Rate limiting, routing |
    | Observability | Contributor | Provides logs and metrics |
    | Customer Management | Indirect | Routes requests only |
    | Payment Processing | Indirect | Routes requests only |
    ```

    ---

    ### 🎯 Role vysvetlenie

    Použi fixný set:

    * **Owner** → komponent tú capability implementuje
    * **Contributor** → pomáha (napr. logy)
    * **Consumer** → iba používa
    * **Indirect** → len cez routing (typické pre gateway)

    ---

    # 🔹 3. Bonus: prepojenie Data ↔ Capability

    Toto je najväčší upgrade (a málo kto to robí):

    ```markdown
    ## Capability → Data mapping

    | Capability | Data |
    |-----------|------|
    | Security | JWT Token |
    | Traffic Management | Rate limit counters |
    | API Management | Routing configuration |
    | Observability | Logs, Metrics |
    ```

    ➡️ zrazu vieš:

    * prečo tie dáta existujú
    * čo sa pokazí keď padnú

    ---

    # 🔹 4. Ako to zapadne do tvojho UI

    Navrhovaná štruktúra:

    ```
    [ Interfaces ]   [ Relationships ]

    [ Data ]         [ Capability Model ]

    [ Business Capabilities (simple tags optional) ]
    ```

    Ale ideálne:
    👉 nahradiť "Business Capabilities" tou tabuľkou

    ---

    # 🔹 5. Mini kritika aktuálneho modelu (užitočné)

    To čo máš teraz:

    ✅ silné:

    * Interfaces (super)
    * Relationships (veľmi dobré)
    * NFRs (rare but great)

    ❌ slabé:

    * capabilities = len labely (bez významu)
    * chýba ownership dát
    * nie je jasné:

      * kto je source of truth
      * čo je cache vs business data

    ---

    # 🔹 TL;DR návrh

    Pridaj 2 veci:

    ### 1. Data sekcia

    * owns / consumes / produces
    * * typ dát

    ### 2. Capability model tabuľka

    * capability + role

    ---

    Ak chceš, viem ti to rovno pretransformovať do JSON/YAML modelu pre váš tool (vyzerá to ako interný katalog tool), aby sa to dalo priamo implementovať.

  business: Ensures that all external and internal requests to the system pass through a single controlled point, increasing security and enabling comprehensive traffic monitoring.
interfaces:
  - direction: provides
    type: rest
    description: Proxy pre vsetky downstream REST API endpointy
  - direction: provides
    type: grpc
    description: gRPC reverse proxy pre interne sluzby
  - direction: consumes
    type: rest
    target: identity-service
    description: Validacia JWT tokenov
  - direction: consumes
    type: db
    target: redis-cache
    description: Rate limiting counters and session cache
  - direction: provides
    type: db
    target: gfdsgfdgfd
    description: gfdgfdsgds
relationships:
  - target: identity-service
    type: depends-on
    connector: rest
  - target: redis-cache
    type: depends-on
    connector: db
  - target: config-db
    type: depends-on
    connector: db
  - target: session-cache
    type: depends-on
    connector: db
    description: Rate limiting counters
  - target: auth-service
    type: communicates-with
    connector: rest
    description: JWT validation on each request
  - target: dmz-boundary
    type: parent-of
    description: Deployed in DMZ network zone
    connector: ''
  - target: dmz-boundary
    type: writes-to
    description: ''
    connector: rest
risks:
  - Single point of failure - gateway outage means full system outage
  - High throughput requires regular load testing
  - Routing rule configuration is complex and error-prone
capabilities:
  - name: Customer Management
    role: indirect
  - name: Product Management
    role: indirect
  - name: Payment Processing
    role: indirect
  - name: Document Management
    role: indirect
data:
  owns:
    - name: customer record
      kind: document
  inputs:
    - name: table in Databricks
      kind: reference
      purpose: load data
  outputs:
    - name: table in Databricks
      kind: reference
processes:
  - name: process A
    role: participant
    activity: supports step A
nfr:
  availability: 98%
  max_latency: 200ms
  rto: '4'
  throughput: 12r/s
  data_classification: public
  scaling: vertical
  rpo: 10 mins
