id: swift-gateway
name: SWIFT Gateway
type: gateway
status: production
owner: payments-infrastructure-team
tags:
  - swift
  - payments
  - international
  - messaging
  - iso20022
description:
  oneliner: Gateway for sending and receiving SWIFT financial messages
  technical: SWIFT Alliance Lite2 integration gateway handling MT and MX (ISO 20022) message formats. Translates internal payment instructions to SWIFT messages and routes incoming SWIFT messages to appropriate internal services. Supports FIN, InterAct, and FileAct protocols. HSM-backed message signing and encryption. Message queue with guaranteed delivery and automatic retry. Dual-site active-passive deployment for business continuity.
  business: Connects the institution to the global SWIFT network used by 11,000+ banks worldwide. Every international wire transfer, correspondent banking message, and securities settlement instruction flows through this gateway. Without it, the institution cannot send or receive international payments.
  description: |-
    SWIFT Alliance Lite2 integration gateway handling MT and MX (ISO 20022) message formats. Translates internal payment instructions to SWIFT messages and routes incoming SWIFT messages to appropriate internal services. Supports FIN, InterAct, and FileAct protocols. HSM-backed message signing and encryption. Message queue with guaranteed delivery and automatic retry. Dual-site active-passive deployment for business continuity.

    Connects the institution to the global SWIFT network used by 11,000+ banks worldwide. Every international wire transfer, correspondent banking message, and securities settlement instruction flows through this gateway. Without it, the institution cannot send or receive international payments.
