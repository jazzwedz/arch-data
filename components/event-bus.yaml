id: event-bus
name: Enterprise Event Bus
type: queue
status: production
owner: platform-team
tags:
  - core
  - infrastructure
  - messaging
  - kafka
description:
  oneliner: Central message broker platform for asynchronous communication
  technical: Apache Kafka cluster (3 brokers, 3 ZooKeeper nodes) with Confluent Schema Registry for Avro schemas. Replication factor 3, min.insync.replicas=2. Retention policy 7 days for most topics, 90 days for audit topics. Kafka Connect for CDC from databases. Monitoring via Confluent Control Center.
  business: Enables individual systems to communicate asynchronously and independently, increasing overall system resilience against outages. Ensures that no message is lost.
  description: |-
    Apache Kafka cluster (3 brokers, 3 ZooKeeper nodes) with Confluent Schema Registry for Avro schemas. Replication factor 3, min.insync.replicas=2. Retention policy 7 days for most topics, 90 days for audit topics. Kafka Connect for CDC from databases. Monitoring via Confluent Control Center.

    Enables individual systems to communicate asynchronously and independently, increasing overall system resilience against outages. Ensures that no message is lost.
interfaces:
  - direction: provides
    type: async
    description: Kafka topics pre publish/subscribe messaging s guaranteed delivery
  - direction: provides
    type: rest
    description: Schema Registry REST API pre registráciu a validáciu schém
  - direction: provides
    type: async
    target: fraud-detection-service
    description: Subscribes to real-time transaction events for scoring
  - direction: provides
    type: async
    target: data-lake-platform
    description: Real-time event ingestion from operational systems
  - direction: provides
    type: async
    target: treaty-config-service
    description: Publishes contract configuration change events
  - direction: provides
    type: async
    target: cashflow-event-store
    description: Subscribes to cashflow events from Risk Adjustment pipeline for persistence
  - direction: provides
    type: async
    target: igr-calculation-service
    description: Consumes validated cashflow events from Risk Adjustment pipeline
  - direction: provides
    type: async
    target: notification-service
    description: Pocuva domenove eventy a triggeruje prislusne notifikacie
  - direction: provides
    type: async
    target: order-service
    description: Publishes order lifecycle events
  - direction: provides
    type: async
    target: payment-service
    description: Publishes payment confirmation and failure events
  - direction: provides
    type: async
    target: retro-efr-service
    description: Publishes retro calculation results
  - direction: provides
    type: async
    target: risk-adjustment-processor
    description: Consumes raw cashflow events from EFR layer
risks:
  - Kafka cluster outage affects all asynchronous communication in the system
  - Schema evolution must be backward compatible, otherwise it breaks consumers
  - Disk space - without monitoring, retention policy can fill up storage
diagram:
  color: '#F97316'
  shape: cylinder
relationships: []
