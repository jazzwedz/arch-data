id: auth-service
name: Authentication Service
type: microservice
status: production
owner: platform-team
tags:
  - auth
  - security
  - core
description:
  oneliner: Handles user authentication and JWT token management
  technical: Spring Boot microservice providing OAuth2/OIDC authentication flows. Issues and validates JWT tokens. Integrates with external IdPs (Google, Microsoft). Manages refresh token rotation and session invalidation. Rate-limited login endpoints with brute-force protection.
  business: Ensures only authorized users can access the system. Supports single sign-on with corporate accounts. Provides secure session management and automatic logout on inactivity.
  description: |-
    Spring Boot microservice providing OAuth2/OIDC authentication flows. Issues and validates JWT tokens. Integrates with external IdPs (Google, Microsoft). Manages refresh token rotation and session invalidation. Rate-limited login endpoints with brute-force protection.

    Ensures only authorized users can access the system. Supports single sign-on with corporate accounts. Provides secure session management and automatic logout on inactivity.
risks:
  - Single point of failure for all authenticated requests
  - Token signing key rotation requires coordinated deployment
links:
  - target: user-db
    role: calls
    protocol: db
    description: Read/write user credentials and sessions
  - target: session-cache
    role: calls
    protocol: db
    description: Session token storage and validation
  - target: internal-zone
    role: part-of
    description: Deployed in internal trusted zone
  - target: api-gateway
    role: calls
    protocol: rest
    description: JWT validation on each request
  - target: api-gateway
    role: serves
    protocol: rest
    description: JWT validation on each request
  - target: session-cache
    role: serves
    protocol: db
    description: Stores and validates session tokens
schema_version: 2
