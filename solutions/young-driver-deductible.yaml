id: young-driver-deductible
name: Young Driver Deductible
status: draft
owner: ''
description:
  description: This solution validates the policyholder's and recorded driver's date of birth to determine whether the standard or a young-driver deductible applies for liability and collision on passenger cars, motorcycles and delivery trucks. It extends the policy administration core, public web quoting, correspondence/document generation, claims settlement and CRM so the young-driver rule is captured consistently at quote time, stored without appearing on documents, and auto-applied at claims. Users are underwriters, policyholders (self-service via WEB), claims handlers and sales agents.
goal: Automatically apply a separate, age-based deductible for young drivers across quoting, policy, web, claims and CRM.
delivers:
  capabilities:
    - Age-based deductible differentiation for young drivers
    - Young driver declaration capture at offer/policy issuance
    - Automatic deductible resolution at claims creation
    - Deductible cap extension on public web quoting
    - Cross-sell opportunity generation for agents
    - Compliant document generation (GPC, offer, policy) without exposing driver DOB
members:
  - component: customer-portal
    disposition: extend
    role: Public WEB quoting UI extended with the young-driver query and raised deductible cap
  - component: api-gateway
    disposition: reuse
    role: Routes quote/policy requests from portal and other channels to the policy core
  - component: identity-service
    disposition: reuse
    role: Authenticates policyholders/agents accessing portal and admin screens
  - component: user-db
    disposition: extend
    role: Stores policyholder and young driver dates of birth used to determine the applicable deductible
  - component: document-archive
    disposition: reuse
    role: Archives generated offers, provisional policies, policies and GPC editions
  - component: event-bus
    disposition: reuse
    role: Propagates young-driver-declared events to downstream systems like CRM
  - component: notification-service
    disposition: reuse
    role: Notifies agents of new cross-sell opportunities generated from the young-driver query
  - component: policy-core-system-core
    disposition: new
  - component: young-driver-deductible-engine
    disposition: new
  - component: claims-deductible-validator
    disposition: new
  - component: correspondence-documents-service
    disposition: new
  - component: crm-sales-opportunity-connector
    disposition: new
  - component: sec-admin-screen
    disposition: new
  - component: ops-view-screen
    disposition: new
